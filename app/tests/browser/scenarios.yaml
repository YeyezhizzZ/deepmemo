scenarios:
  - id: deepme-public-home
    name: 打开 DeepMe 公开问答首页
    area: public-chat
    priority: high
    status: active
    dataset: smoke_basic
    intent: 访客看到作者公开知识库、推荐问题和提问输入框。
    steps:
      - assert_visible:
          label: DeepMe 首页
      - assert_visible:
          label: 当前知识来源
      - assert_visible:
          label: 提问输入框
    asserts:
      - visible:
          label: 问答模式

  - id: deepme-public-question
    name: 基于公开知识库发送问题
    area: public-chat
    priority: high
    status: active
    dataset: smoke_basic
    intent: 访客发送问题后看到流式问答记录。
    steps:
      - type_input:
          value: DeepMemo 是什么
      - click:
          role: button
          name: 发送
      - assert_visible:
          label: 问答记录
    asserts:
      - visible:
          label: 问答记录

  - id: deepme-upload-files
    name: 上传自己的知识文件
    area: temporary-workspace
    priority: high
    status: active
    dataset: smoke_basic
    intent: 访客切换上传模式，上传 Markdown 并看到文件处理状态。
    steps:
      - click:
          role: button
          name: 问你的资料
      - upload_knowledge:
          path: fixtures/smoke_basic/data/ideas/mock-note.md
      - assert_visible:
          label: 已上传文件
      - assert_visible:
          testId: workspace-ready
    asserts:
      - visible:
          label: 当前知识来源
