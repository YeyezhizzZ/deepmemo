[project]
name = "deepmemo"
version = "0.6.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "openai>=1.30.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "watchdog>=3.0",
    "tavily-python>=0.7.0",
    "mcp>=1.27.0",
    "pillow>=12.2.0",
    "six>=1.17.0",
    "werkzeug>=3.1.8",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.1",
    "python-multipart>=0.0.27",
    "pypdf>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end scenario tests (may be slower)",
]
