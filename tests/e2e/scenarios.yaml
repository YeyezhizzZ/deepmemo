scenarios:
  - id: fs_create_write_read_move
    spec: openspec/specs/fs/spec.md
    name: "文件创建、写入、读取和移动的完整生命周期"
    description: |
      通过 API 创建 Markdown 文件，写入更新后的内容，再读取验证内容一致。
      随后移动文件，并确认新路径可读、旧路径不再出现在文件树中。
    tags: [fs, critical]

  - id: chat_citation_traceability
    spec: openspec/specs/chat/spec.md
    name: "问答引用可以追溯到源文件和原会话"
    description: |
      创建会话和一条带 citation 的 AI 消息，随后通过 citations API
      获取证据链，并通过 file-references API 从文件路径反查对应会话。
    tags: [chat, citations, critical]

  - id: deepme_temporary_workspace_lifecycle
    spec: docs/specs/proposed/deepme-temporary-workspace.md
    name: "DeepMe 临时知识空间完整生命周期"
    description: |
      匿名访客创建 workspace，上传 Markdown，Worker 构建可查询版本。
      创建 temporary session 后主动删除，旧会话立即不可访问。
    tags: [deepme, workspace, isolation, critical]
